name: Проверка цен на билеты

on:
  schedule:
    # Каждые 4 часа (время UTC; GitHub может запускать с опозданием до ~30 минут)
    - cron: "17 */4 * * *"
    # Ежедневный отчёт в 9:00 по Москве (= 6:00 UTC)
    - cron: "0 6 * * *"
  workflow_dispatch:          # кнопка «Run workflow» — проверить прямо сейчас
    inputs:
      dry_run:
        description: "Пробный запуск: не сохранять и не слать уведомления"
        type: boolean
        default: false
      report:
        description: "Отправить отчёт в Telegram прямо сейчас"
        type: boolean
        default: false

permissions:
  contents: write             # сохранить историю цен в data/
  pages: write                # опубликовать сайт
  id-token: write

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установка
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Проверка цен
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          FLI_TIMEOUT: "12"
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_REPORT: ${{ inputs.report && '1' || '' }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          python -m tracker run ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Сохранить историю
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "flight-tracker"
          git config user.email "flight-tracker@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Цены: $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase --autostash || true
          git push

      - uses: actions/configure-pages@v5
        if: ${{ !inputs.dry_run }}
      - uses: actions/upload-pages-artifact@v3
        if: ${{ !inputs.dry_run }}
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
        if: ${{ !inputs.dry_run }}
